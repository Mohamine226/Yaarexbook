version: "3.9"

services:
  db:
    image: postgres:15
    container_name: daaga_db
    restart: always
    environment:
      POSTGRES_USER: mohamine
      POSTGRES_PASSWORD: 6414Gnam1
      POSTGRES_DB: daagabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  api:
    build: .
    container_name: daaga
    restart: always
    depends_on:
