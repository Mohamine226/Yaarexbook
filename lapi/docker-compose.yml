    environment:
      DATABASE_URL: "postgresql://postgres:EWhhbJfkHnFAhroAhPnQFyGulFxWdyEF@postgres.railway.internal:5432/railway"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./app/uploads:/app/uploads


volumes:
  postgres_data: